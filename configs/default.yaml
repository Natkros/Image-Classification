seed: 42
device: auto            # auto | cpu | cuda | mps

data:
  # Root that contains seg_train/seg_train/<class>/*.jpg and seg_test/seg_test/<class>/*.jpg
  root: data/intel
  train_dir: null       # auto-detected from root if left null
  test_dir: null        # auto-detected from root if left null
  val_split: 0.15       # fraction of the train set carved out for validation
  image_size: 224
  batch_size: 32
  num_workers: 4
  # Normalisation: ImageNet statistics, because we start from ImageNet weights
  mean: [0.485, 0.456, 0.406]
  std:  [0.229, 0.224, 0.225]

augment:
  random_resized_crop: true
  crop_scale: [0.7, 1.0]
  horizontal_flip: 0.5
  rotation_degrees: 12
  color_jitter: 0.2     # brightness/contrast/saturation strength; 0 disables
  random_erasing: 0.15  # probability; 0 disables

model:
  name: resnet18        # resnet18 | resnet34 | resnet50 | efficientnet_b0 | mobilenet_v3_large | convnext_tiny
  pretrained: true
  dropout: 0.2
  # Stage 1 trains only the new classifier head, stage 2 unfreezes the backbone.
  freeze_backbone: true
  unfreeze_at_epoch: 3  # set to null to never unfreeze

train:
  epochs: 12
  lr: 0.001             # learning rate for the head
  backbone_lr: 0.0001   # smaller LR for pretrained weights once unfrozen
  weight_decay: 0.0001
  label_smoothing: 0.05
  optimizer: adamw      # adamw | sgd
  scheduler: cosine     # cosine | plateau | none
  warmup_epochs: 1
  amp: true             # mixed precision (ignored on CPU)
  grad_clip: 1.0
  early_stopping_patience: 5
  class_weights: false  # set true for imbalanced datasets

output:
  dir: outputs
  run_name: null        # auto-generated from model name + timestamp if null
  save_best_only: true
